<body>
<div id="app"></div>

<script>
(function(){
  const USERS_KEY = "sg_users_v2";
  const MESSAGES_KEY = "sg_messages_v2";
  const PRESENCE_KEY = "sg_presence_v2";
  const ONLINE_WINDOW_MS = 9000;
  const HEARTBEAT_MS = 4000;
  const POLL_MS = 2000;
  const MAX_STORED_MESSAGES = 200;
  const CRYPTO_PASSPHRASE = "study-group-chalkboard-room-key-v1";

  let currentUser = null;
  let pollTimer = null;
  let heartbeatTimer = null;
  let cryptoKey = null;

  const app = document.getElementById('app');

  // ---------- encryption helpers (AES-GCM, key derived from a fixed room passphrase) ----------
  async function getCryptoKey(){
    if(cryptoKey) return cryptoKey;
    const enc = new TextEncoder();
    const hash = await crypto.subtle.digest('SHA-256', enc.encode(CRYPTO_PASSPHRASE));
    cryptoKey = await crypto.subtle.importKey('raw', hash, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
    return cryptoKey;
  }
  function bufToB64(buf){
    const bytes = new Uint8Array(buf);
    let bin = '';
    for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64ToBuf(b64){
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return arr.buffer;
  }
  async function encryptText(plainText){
    const key = await getCryptoKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();
    const cipherBuf = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(plainText));
    return JSON.stringify({ iv: bufToB64(iv), data: bufToB64(cipherBuf) });
  }
  async function decryptText(payloadStr){
    const key = await getCryptoKey();
    const payload = JSON.parse(payloadStr);
    const iv = new Uint8Array(b64ToBuf(payload.iv));
    const cipherBuf = b64ToBuf(payload.data);
    const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, cipherBuf);
    return new TextDecoder().decode(plainBuf);
  }

  // ---------- storage helpers (encrypted at rest) ----------
  async function safeGet(key){
    try{
      const res = await window.storage.get(key, true);
      if(!res) return null;
      const decrypted = await decryptText(res.value);
      return JSON.parse(decrypted);
    }catch(e){
      return null;
    }
  }
  async function safeSet(key, value){
    try{
      const encrypted = await encryptText(JSON.stringify(value));
      const res = await window.storage.set(key, encrypted, true);
      return !!res;
    }catch(e){
      console.error('storage set failed', e);
      return false;
    }
  }

  async function getUsers(){ return (await safeGet(USERS_KEY)) || {}; }
  async function getMessages(){ return (await safeGet(MESSAGES_KEY)) || []; }
  async function getPresence(){ return (await safeGet(PRESENCE_KEY)) || {}; }

  // ---------- toast ----------
  let toastTimer = null;
  function showToast(msg){
    let toast = document.getElementById('toast');
    if(!toast){
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = 'toast';
      app.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  // ---------- squiggle svg ----------
  const squiggleSvg = '<svg class="squiggle" width="120" height="14" viewBox="0 0 120 14" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M2 8 C 12 -2, 22 18, 32 8 C 42 -2, 52 18, 62 8 C 72 -2, 82 18, 92 8 C 100 1, 110 12, 118 6" stroke="#F2C14E" stroke-width="2.5" stroke-linecap="round"/>' +
    '</svg>';

  // ---------- AUTH SCREEN ----------
  function renderAuth(errorMsg){
    app.innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card">
          <h1 class="auth-title">Study Group</h1>
          ${squiggleSvg}
          <p class="auth-sub">sign in to join the session</p>
          <div class="field">
            <label>Username</label>
            <input id="username" type="text" autocomplete="off" placeholder="e.g. priya_23" />
          </div>
          <div class="field">
            <label>Password</label>
            <input id="password" type="password" placeholder="password" />
          </div>
          <button class="auth-btn" id="enterBtn">Enter the group</button>
          <div class="auth-error" id="authError">${errorMsg || ''}</div>
          <p class="auth-hint">First time? Pick a username &amp; password, it becomes yours.<br/>Already joined? Log back in with the same password.</p>
        </div>
      </div>
    `;
    if(errorMsg){ document.getElementById('authError').style.display = 'block'; }

    const btn = document.getElementById('enterBtn');
    const uInput = document.getElementById('username');
    const pInput = document.getElementById('password');

    async function attempt(){
      const username = uInput.value.trim();
      const password = pInput.value;
      if(!username || !password){
        renderAuth('Please enter both a username and password.');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Checking...';
      const users = await getUsers();
      if(Object.prototype.hasOwnProperty.call(users, username)){
        if(users[username] !== password){
          renderAuth('That username is taken and the password is wrong.');
          return;
        }
      } else {
        users[username] = password;
        await safeSet(USERS_KEY, users);
      }
      currentUser = username;
      await markOnline();
      renderChat();
      startLoops();
    }

    btn.addEventListener('click', attempt);
    pInput.addEventListener('keydown', e => { if(e.key === 'Enter') attempt(); });
    uInput.addEventListener('keydown', e => { if(e.key === 'Enter') pInput.focus(); });
  }

  // ---------- presence ----------
  async function markOnline(){
    if(!currentUser) return;
    const presence = await getPresence();
    presence[currentUser] = Date.now();
    await safeSet(PRESENCE_KEY, presence);
  }

  function countOnline(presence){
    const now = Date.now();
    return Object.values(presence).filter(ts => now - ts < ONLINE_WINDOW_MS).length;
  }

  // ---------- image compression ----------
  function compressImage(file, maxWidth, quality){
    maxWidth = maxWidth || 640;
    quality = quality || 0.62;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if(w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('Could not read image'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('Could not read file'));
      reader.readAsDataURL(file);
    });
  }

  // ---------- chat screen ----------
  function renderChat(){
    app.innerHTML = `
      <div class="header">
        <div class="header-top">
          <div>
            <h1 class="header-title">Study Group</h1>
          </div>
          <button class="leave-btn" id="leaveBtn">Leave</button>
        </div>
        <div class="online-row">
          <span class="online-dot"></span>
          <span class="online-text" id="onlineText">checking...</span>
        </div>
        <div class="lock-note">🔒 messages &amp; images are encrypted before they're saved</div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <button class="icon-btn attach-btn" id="attachBtn" title="Send an image">📎</button>
        <input type="file" id="imageInput" accept="image/*" style="display:none" />
        <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off" />
        <button class="icon-btn send-btn" id="sendBtn">➤</button>
      </div>
    `;

    document.getElementById('leaveBtn').addEventListener('click', leave);
    const input = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const imageInput = document.getElementById('imageInput');

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });
    attachBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', handleImageSelect);

    const container = document.getElementById('messages');
    container.addEventListener('click', (e) => {
      if(e.target.classList.contains('msg-image')){
        openLightbox(e.target.src);
      }
    });

    refreshMessages();
    refreshPresence();
  }

  function openLightbox(src){
    const overlay = document.createElement('div');
    overlay.className = 'lightbox';
    const img = document.createElement('img');
    img.src = src;
    overlay.appendChild(img);
    overlay.addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  function formatTime(ts){
    const d = new Date(ts);
    let h = d.getHours(); const m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    return h + ':' + String(m).padStart(2,'0') + ' ' + ampm;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function refreshMessages(){
    const container = document.getElementById('messages');
    if(!container) return;
    const messages = await getMessages();
    const wasAtBottom = container.scrollTop + container.clientHeight >= container.scrollHeight - 40;

    if(messages.length === 0){
      container.innerHTML = '<div class="empty-state">No messages yet.<br/>Say hi to the study group 👋</div>';
      return;
    }

    container.innerHTML = messages.map(m => {
      const isOwn = m.username === currentUser;
      const body = m.type === 'image'
        ? `<img class="msg-image" src="${m.dataUrl}" alt="shared image" />`
        : `<div class="bubble">${escapeHtml(m.text)}</div>`;
      return `
        <div class="msg-row ${isOwn ? 'own' : 'other'}">
          <div class="msg-block">
            <div class="msg-name">${escapeHtml(m.username)}</div>
            ${body}
            <div class="msg-time">${formatTime(m.ts)}</div>
          </div>
        </div>
      `;
    }).join('');

    if(wasAtBottom || messages[messages.length - 1].username === currentUser){
      container.scrollTop = container.scrollHeight;
    }
  }

  async function refreshPresence(){
    const el = document.getElementById('onlineText');
    if(!el) return;
    const presence = await getPresence();
    const count = countOnline(presence);
    el.textContent = count === 1 ? '1 person online' : (count + ' people online');
  }

  async function pushMessage(msgObj){
    const messages = await getMessages();
    messages.push(msgObj);
    const trimmed = messages.length > MAX_STORED_MESSAGES
      ? messages.slice(messages.length - MAX_STORED_MESSAGES)
      : messages;
    const ok = await safeSet(MESSAGES_KEY, trimmed);
    if(!ok){ showToast("Couldn't save that message, please try again."); }
    await refreshMessages();
  }

  async function sendMessage(){
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if(!text || !currentUser) return;
    input.value = '';
    await pushMessage({ username: currentUser, type: 'text', text: text, ts: Date.now() });
  }

  async function handleImageSelect(e){
    const file = e.target.files[0];
    e.target.value = '';
    if(!file || !currentUser) return;
    if(!file.type.startsWith('image/')){
      showToast('Please choose an image file.');
      return;
    }
    showToast('Sending image...');
    try{
      const dataUrl = await compressImage(file);
      await pushMessage({ username: currentUser, type: 'image', dataUrl: dataUrl, ts: Date.now() });
    }catch(err){
      showToast('Could not send that image.');
    }
  }

  function startLoops(){
    stopLoops();
    heartbeatTimer = setInterval(markOnline, HEARTBEAT_MS);
    pollTimer = setInterval(async () => {
      await refreshMessages();
      await refreshPresence();
    }, POLL_MS);
  }

  function stopLoops(){
    if(pollTimer) clearInterval(pollTimer);
    if(heartbeatTimer) clearInterval(heartbeatTimer);
    pollTimer = null;
    heartbeatTimer = null;
  }

  async function leave(){
    stopLoops();
    if(currentUser){
      const presence = await getPresence();
      delete presence[currentUser];
      await safeSet(PRESENCE_KEY, presence);
    }
    currentUser = null;
    renderAuth();
  }

  window.addEventListener('beforeunload', () => {
    if(currentUser){
      getPresence().then(p => { delete p[currentUser]; safeSet(PRESENCE_KEY, p); });

  renderAuth();
})();
